<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jailbreak</title>
  <!-- Keep run-page styles inline; completion icons are requested only on success. -->
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #0b0d10; color: #fff; font: 18px/1.5 "Segoe UI", Arial, sans-serif; }
.center { position: fixed; top: 50%; left: 0; width: 100%; transform: translateY(-50%); text-align: center; padding: 24px; }
.indicator { position: relative; width: 144px; height: 144px; margin: 0 auto; }
.ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 5px solid #263442; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.web-icon { position: absolute; width: 84px; height: 84px; top: 30px; left: 30px; object-fit: contain; }
.caption { margin: 26px 0 0; font-size: 20px; letter-spacing: 0.03em; }
#padlock { display: none; position: absolute; width: 100px; height: 100px; top: 22px; left: 22px; background: center / contain no-repeat; }
#exit { display: none; }
.ps-button { display: inline-block; width: 40px; height: 40px; margin: 0 8px; vertical-align: middle; background: center / contain no-repeat; }
body.done .ring { animation: none; border-color: #fff; }
body.done #padlock { display: block; background-image: url("assets/padlock.png"); }
body.done #exit { display: block; }
body.done .ps-button { background-image: url("assets/psButton.png"); }
#ramBox, #wrap, #state, #out, #msg { display: none; }
body.fail .indicator { display: none; }
body.fail #exit { display: none; }
body.fail #msg { display: block; color: #efaaa2; text-align: center; padding: 24px; position: fixed; top: 50%; left: 0; width: 100%; transform: translateY(-50%); }
body.cache-error .ring { animation: none; border-color: #efaaa2; }
body.cache-error .caption { color: #efaaa2; }
.byline { position: fixed; bottom: 9px; left: 11px; margin: 0; color: #4d5765; font: 11px/1 Consolas, monospace; }
  </style>
</head>
<body>
  <main class="center">
    <div class="indicator" id="spin" role="status" aria-label="Desbloqueio em andamento">
      <div class="ring" aria-hidden="true"></div>
      <span id="padlock" aria-hidden="true"></span>
    </div>
    <p class="caption" id="exit">Press <span class="ps-button" role="img" aria-label="PS button"></span> to exit</p>
  </main>
  <div id="ramBox"></div>
  <div id="msg">Restart your console</div>
  <div id="wrap"><div id="state"></div><div id="out"></div></div>
  <p class="byline">by well0nez/m0zz</p>
  <script type="module">import "./jb.js";</script>
</body>
</html>
